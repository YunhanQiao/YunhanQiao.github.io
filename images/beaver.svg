  <path d="M47 96 l-3 2.5 3 2.5 M69 96 l3 2.5 -3 2.5 M60 94.5 l-4 8" fill="none" stroke="#f59a6c" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="36" y="107" width="44" height="4" rx="2" fill="#3d3631"/>
